<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Butterchurn Visualizer</title>
    <meta http-equiv="Content-Type" content="charset=UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
      :root { 
        color-scheme: dark; 
      }
      html, body { 
        margin: 0; 
        height: 100%;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at 50% 30%, #1a1a28, #06060a);
        color: #e8e8ee; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
      }
      main { 
        text-align: center; 
        padding: 32px; 
        max-width: 560px; 
      }
      h1 { 
        font-size: 30px; 
        margin: 0 0 6px; 
      }
      p.sub { 
        opacity: .65; 
        margin: 0 0 32px; 
      }
      .cards { 
        display: flex; 
        gap: 18px; 
        flex-wrap: wrap; 
        justify-content: center; 
      }
      a.card { 
        flex: 1 1 200px; 
        text-decoration: none; 
        color: inherit;
        background: rgba(255,255,255,0.04); 
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 14px; 
        padding: 22px 20px; 
        transition: transform .15s, border-color .15s, background .15s; 
      }
      a.card:hover { 
        transform: translateY(-3px); 
        border-color: #2b6cff; 
        background: rgba(43,108,255,0.10); 
      }
      a.card h2 { 
        margin: 0 0 6px; 
        font-size: 18px; 
      }
      a.card span { 
        font-size: 13px; 
        opacity: .65; 
      }
      footer { 
      margin-top: 30px; 
      font-size: 12px; 
      opacity: .4; 
      }
      footer a {
        color: #7aa2ff; 
      }
  </style>
</head>
  <body>
    <main>
      <h1>🎵 Butterchurn Visualizer</h1>
      <p class="sub">Milkdrop-style audio visualizer</p>
      <div class="cards">
        <a class="card" href="obs.html">
        <h2>OBS build →</h2>
        <span>On-screen control panel. Press H to hide for capture.</span>
        </a>
        <a class="card" href="fullscreen.html">
          <h2>Fullscreen build →</h2>
          <span>Keyboard-only, no UI. Cleaner to window-capture.</span>
        </a>
      </div>
      <footer>
        Built on <a href="https://github.com/jberg/butterchurn">butterchurn</a>.
      </footer>
    </main>
  </body>
</html>
