<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Butterchurn Visualizer — OBS Browser Source</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/panel.css">

  </head>
  <body>
    <canvas id="viz"></canvas>
    <div id="panel">
      <h1>🎵 Butterchurn — OBS setup</h1>
      <label for="device">Audio input</label>
      <select id="device"><option value="">— grant mic access first —</option></select>
      <button id="startBtn">Start visualizer</button>
      <label for="preset" style="margin-top:16px;">Preset</label>
      <select id="preset"></select>
      <div class="row">
        <button class="secondary" id="prevBtn">‹ Prev</button>
        <button class="secondary" id="nextBtn">Next ›</button>
        <button id="randBtn">Random</button>
      </div>
      <div class="check">
        <input type="checkbox" id="cycle" checked>
        <label for="cycle" style="margin:0; text-transform:none; opacity:1; font-size:13px;">Auto-cycle every</label>
        <input type="number" id="cycleSecs" value="20" min="3" style="width:64px;"> s
      </div>
      <div id="status"></div>
      <div class="hint">
        Press <code>H</code> to hide/show this panel. To visualize music (not your mic),
        route audio through a virtual cable (VB-Cable / BlackHole / PipeWire loopback)
        and select that device above.
      </div>
    </div>
    <script src="vendor/butterchurn.min.js"></script>
    <script src="vendor/butterchurnExtraImages.min.js"></script>
    <script src="vendor/butterchurnPresets.min.js"></script>
    <script src="vendor/butterchurnPresetsExtra.min.js"></script>
    <script src="vendor/butterchurnPresetsExtra2.min.js"></script>
    <script src="vendor/butterchurnPresetsMD1.min.js"></script>
    <script src="js/visualizer-core.js"></script>
    <script src="js/obs-ui.js"></script>
  </body>
</html>
