<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-eval';
                   style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;
                   object-src 'none'; base-uri 'none'">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1a2n Visualizer &mdash; Performance</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/fullscreen.css">
  </head>
  <body>
    <canvas id="viz"></canvas>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="help">
      <div class="box">
        <p class="eyebrow">1a2n Visualizer</p>
        <h1>Performance Mode</h1>
        <p>Keyboard controls</p>
        <table>
          <tr><td class="k"><kbd>7</kbd></td><td>Play the next low energy preset</td></tr>
          <tr><td class="k"><kbd>8</kbd></td><td>Play the next medium energy preset</td></tr>
          <tr><td class="k"><kbd>9</kbd></td><td>Play the next high energy preset</td></tr>
          <tr><td class="k"><kbd>?</kbd></td><td>Show this help</td></tr>
        </table>
        <div class="go pulse" id="startPrompt">Click or press any key to start</div>
        <p id="startError" class="start-error" role="alert"></p>
      </div>
    </div>
    <script defer src="vendor/butterchurn.min.js"></script>
    <script defer src="vendor/butterchurnExtraImages.min.js"></script>
    <script defer src="vendor/butterchurnPresets.min.js"></script>
    <script defer src="vendor/butterchurnPresetsExtra.min.js"></script>
    <script defer src="vendor/butterchurnPresetsExtra2.min.js"></script>
    <script defer src="vendor/butterchurnPresetsMD1.min.js"></script>
    <!-- Optional lazy-loaded extra presets (generated by
         tools/fetch-extra-presets.py). A missing file 404s harmlessly.
         Experimental textures load lazily; see ensureExperimentalImages. -->
    <script defer src="presets-extra/index.js"></script>
    <!-- Catalog bundles generated from energy-catalog.json and
         performance-catalog.json by tools/curate_catalogs.py. -->
    <script defer src="catalogs/energy-catalog.js"></script>
    <script defer src="catalogs/performance-catalog.js"></script>
    <script defer src="js/device-errors.js"></script>
    <script defer src="js/audio-prefs.js"></script>
    <script defer src="js/render-driver.js"></script>
    <script defer src="js/audible-keepalive.js"></script>
    <script defer src="js/audio-watchdog.js"></script>
    <script defer src="js/visualizer-core.js"></script>
    <script defer src="js/performance-ui.js"></script>
  </body>
</html>
