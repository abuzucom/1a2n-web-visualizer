<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterchurn — Fullscreen</title>
    <link rel="stylesheet" href="css/fullscreen.css">
  </head>
  <body>
    <canvas id="viz"></canvas>
    <div id="toast"></div>
    <div id="help">
      <div class="box">
        <h1>🎵 Butterchurn</h1>
        <p>Fullscreen Milkdrop visualizer</p>
        <table>
          <tr><td class="k"><kbd>Space</kbd> / <kbd>N</kbd></td><td>Next preset</td></tr>
          <tr><td class="k"><kbd>P</kbd></td><td>Previous preset</td></tr>
          <tr><td class="k"><kbd>R</kbd></td><td>Random preset</td></tr>
          <tr><td class="k"><kbd>C</kbd></td><td>Toggle auto-cycle</td></tr>
          <tr><td class="k"><kbd>[</kbd> / <kbd>]</kbd></td><td>Cycle interval −/+</td></tr>
          <tr><td class="k"><kbd>D</kbd></td><td>Switch audio input</td></tr>
          <tr><td class="k"><kbd>F</kbd></td><td>Toggle fullscreen</td></tr>
          <tr><td class="k"><kbd>?</kbd></td><td>Show this help</td></tr>
        </table>
        <div class="go">Click or press any key to start →</div>
      </div>
    </div>
    <script src="vendor/butterchurn.min.js"></script>
    <script src="vendor/butterchurnExtraImages.min.js"></script>
    <script src="vendor/butterchurnPresets.min.js"></script>
    <script src="vendor/butterchurnPresetsExtra.min.js"></script>
    <script src="vendor/butterchurnPresetsExtra2.min.js"></script>
    <script src="vendor/butterchurnPresetsMD1.min.js"></script>
    <script src="js/visualizer-core.js"></script>
    <script src="js/fullscreen-ui.js"></script>
  </body>
</html>
