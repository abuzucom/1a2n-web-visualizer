name: Dependabot Changelog Companion

on:
  workflow_run:
    workflows: [Convention Sync Check]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-companion:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # persist-credentials: true: this job pushes the generated changelog branch (Rule 11 exception).
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Configure generated commit identity
        run: >-
          git config user.name "github-actions[bot]" &&
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create linked changelog draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/create_dependabot_changelog_pr.py
