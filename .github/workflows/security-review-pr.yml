name: security-review-pr

# Runs the abuzucom/agents-personas foucault security review on this
# repository's pull requests. The wrapper loads the engine, the foucault
# policy, and the model adapter from the pinned agents-personas commit, so
# this repository supplies no adapter files.
#
# The workflow_run trigger keeps this caller on default branch code. A pull
# request cannot edit the reviewer. The engine publishes a skipped
# "foucault / security" check for a fork pull request and withholds the
# provider key from it.

on:
  workflow_run:
    workflows: [Immutable Compliance]
    types: [completed]

concurrency:
  group: security-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-pr:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      already_reviewed: ${{ steps.resolve.outputs.already_reviewed }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_repo_url: ${{ steps.resolve.outputs.head_repo_url }}
      head_repo_full_name: ${{ steps.resolve.outputs.head_repo_full_name }}
    steps:
      - name: Resolve pull request from workflow run head
        id: resolve
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const headSha = workflowRun?.head_sha;
            if (!/^[0-9a-f]{40}$/.test(headSha || "")) {
              core.setFailed("workflow run head SHA is invalid");
              return;
            }

            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha,
                per_page: 100,
              },
            );
            const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const candidates = pullRequests.filter((pullRequest) =>
              pullRequest.base?.repo?.full_name?.toLowerCase() ===
              baseRepository.toLowerCase() &&
              pullRequest.head?.sha?.toLowerCase() === headSha.toLowerCase()
            );
            if (candidates.length !== 1) {
              core.setFailed(
                `expected one pull request for workflow run head, found ${candidates.length}`,
              );
              return;
            }

            const pullRequest = candidates[0];
            const headRepository = pullRequest.head?.repo;
            if (!headRepository?.full_name || !headRepository.clone_url) {
              core.setFailed("pull request head repository metadata is unavailable");
              return;
            }

            // One model call per head revision. The engine reruns a passing
            // review. The caller therefore skips a head with an Actions check
            // that already carries a verdict title. A run that ends before a
            // verdict uses another title. A flaky review then retries.
            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                check_name: "foucault / security",
                per_page: 100,
              },
            );
            const verdictChecks = checkRuns.filter((run) =>
              run.app?.slug === "github-actions" &&
              run.status === "completed" &&
              /^VERDICT: (APPROVE|BLOCK|NEEDS-HUMAN)$/.test(
                run.output?.title || ""
              )
            );

            // Any workflow with checks: write can publish a verdict title.
            // Only a check suite from this caller's own workflow_run
            // execution runs default branch code. A pull request workflow
            // runs with another event, so its check never marks the head.
            const callerPath = ".github/workflows/security-review-pr.yml";
            const fromCaller = async (check) => {
              const suiteId = check.check_suite?.id;
              if (!suiteId) {
                return false;
              }
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_suite_id: suiteId,
                per_page: 100,
              });
              return data.workflow_runs.some((run) =>
                run.event === "workflow_run" && run.path === callerPath);
            };
            const callerVerdicts = await Promise.all(verdictChecks.map(fromCaller));
            const alreadyReviewed = callerVerdicts.includes(true);
            core.setOutput("already_reviewed", alreadyReviewed ? "true" : "false");
            core.setOutput("pr_number", String(pullRequest.number));
            core.setOutput("base_sha", pullRequest.base.sha);
            core.setOutput("head_sha", pullRequest.head.sha);
            core.setOutput("head_repo_url", headRepository.clone_url);
            core.setOutput("head_repo_full_name", headRepository.full_name);

  review:
    needs: resolve-pr
    if: needs.resolve-pr.result == 'success' && needs.resolve-pr.outputs.already_reviewed != 'true'
    # The wrapper posts a pull request comment and publishes a check run.
    permissions:
      checks: write
      contents: read
      pull-requests: write
    # agents-personas 1.0.0. Keep the uses: pin and personas_ref on the same
    # commit.
    uses: abuzucom/agents-personas/.github/workflows/foucault-security-review.yml@1649e5c9710fd85d6cca12006e344af27a5404a6
    with:
      personas_ref: "1649e5c9710fd85d6cca12006e344af27a5404a6"
      pr_comment: true
      fail_on_block: true
      pr_number: ${{ needs.resolve-pr.outputs.pr_number }}
      base_sha: ${{ needs.resolve-pr.outputs.base_sha }}
      head_sha: ${{ needs.resolve-pr.outputs.head_sha }}
      head_repo_url: ${{ needs.resolve-pr.outputs.head_repo_url }}
      head_repo_full_name: ${{ needs.resolve-pr.outputs.head_repo_full_name }}
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
