name: Deploy to GitHub Pages

# Publishes the contents of src/ to GitHub Pages on every push to develop.
# The src/ folder becomes the site root, so pages are served at:
#   https://<user>.github.io/<repo>/obs.html
#   https://<user>.github.io/<repo>/fullscreen.html
#
# One-time setup: in the repo, go to Settings -> Pages and set
# "Build and deployment" -> Source to "GitHub Actions".
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Permissions required by the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload site artifact (src/)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: src

      # The Pages backend intermittently rejects fresh deployments with a
      # generic "Deployment failed, try again later." even though the site
      # and artifact are fine; an immediate second attempt reliably succeeds.
      # First attempt is allowed to fail, then one retry decides the job.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Publish deployment to Jira
        env:
          JIRA_BASE_URL: https://abuzucom.atlassian.net
          JIRA_PROJECT_KEY: VID
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          JIRA_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
        run: python3 scripts/jira_sync.py deployment
