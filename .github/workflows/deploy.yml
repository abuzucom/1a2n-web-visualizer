name: Deploy to Cloudflare Pages

# Publishes the contents of src/ to Cloudflare Pages on every push to develop.
# One-time setup in GitHub:
#   - Secrets:
#       CLOUDFLARE_API_TOKEN
#       CLOUDFLARE_ACCOUNT_ID
#   - Variables (optional):
#       CLOUDFLARE_PAGES_PROJECT (defaults to this repository name)
#
# One-time setup in Cloudflare:
#   - Create a Pages project
#   - Set its production branch to develop
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Permissions required to read repository contents during deployment.
permissions:
  contents: read

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy src --project-name ${{ vars.CLOUDFLARE_PAGES_PROJECT || github.event.repository.name }} --branch develop
