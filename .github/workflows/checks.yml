name: Checks

# Keeps AGENTS.md-derived docs and code quality enforced on every change.
# Separate from deploy.yml (Pages publishing has different
# triggers/permissions and isn't relevant here).
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  agents-md-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check AGENTS.md copies are in sync
        run: python3 scripts/sync.py --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Install ruff
        # Pinned to a commit (not the mutable v3 tag) per CodeQL's
        # unpinned-third-party-action finding; resolved from tag v3.
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3

      - name: ruff check
        run: ruff check tools/
