name: Checks

# Keeps AGENTS.md-derived docs and code quality enforced on every change.
# Separate from deploy.yml (Pages publishing has different
# triggers/permissions and isn't relevant here).
on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agents-md-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check AGENTS.md copies are in sync
        run: python3 scripts/sync.py --check

      - name: Check GitHub Actions are pinned
        run: python3 scripts/check_action_pins.py

      - name: Check AGENTS.md style
        run: python3 scripts/lint_style.py

      - name: Check AGENTS.md American spelling
        run: python3 scripts/check_us_spelling.py AGENTS.md

      - name: Check AGENTS.md is English only
        run: python3 scripts/check_english_only.py AGENTS.md

  banned-agents:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check banned-agent authorship
        run: |
          python3 scripts/check_banned_agents.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  branch-name:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check branch name
        run: python3 scripts/check_branch_name.py "${{ github.head_ref }}"

  commit-message:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check commit message style
        run: |
          python3 scripts/check_commit_message.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check persist-credentials on checkout steps
        run: python3 scripts/check_persist_credentials.py .github/workflows/*.yml

      - name: Check for unjustified MD5/SHA-1
        run: python3 scripts/check_weak_hashing.py scripts/*.py tools/*.py

      - name: Check for non-root containers
        run: python3 scripts/check_dockerfile_root.py Dockerfile docker-compose.yml

      - name: Check for likely secrets
        run: python3 scripts/check_secrets_heuristic.py scripts/*.py tools/*.py .github/workflows/*.yml .pre-commit-config.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        # --ignore-scripts: milkdrop-shader-converter's own "install" script
        # (a native C++ compile) would otherwise run before our postinstall
        # patches it, and fail against Node 22 -- lint doesn't need that
        # addon built, only the JS/Python source to exist. See
        # tools/convert-milk-presets.js's header for the real build steps.
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npx eslint .

      - name: Install ruff
        # Pinned to a commit rather than a mutable release tag.
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

      - name: ruff check
        run: ruff check tools/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Install coverage tools
        run: pip install lcov_cobertura coverage

      - name: Run Node unit tests with coverage
        run: |
          node --test --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=coverage.lcov \
            tests/*.js

      - name: Convert JS coverage to Cobertura
        run: python3 -m lcov_cobertura coverage.lcov --output coverage-js.xml

      - name: Run Python unit tests with coverage
        run: python3 -m coverage run -m unittest discover -s tests

      - name: Generate Python Cobertura report
        run: python3 -m coverage xml -o coverage-python.xml

      - name: Upload JS coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-javascript
          path: coverage-js.xml

      - name: Upload Python coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-python
          path: coverage-python.xml

  validate-presets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Validate preset chunk callback IDs
        run: npm run validate:presets

      - name: Validate experimental presets
        run: npm run validate:exp

  html-css-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download and verify vnu.jar
        # validator/validator publishes its one recommended, production-ready
        # jar under the "latest" release tag rather than per-version tags
        # (currently vnu 26.8.6); the hash below, computed from that exact
        # download, is the real pin. Upstream ships only MD5/SHA-1 checksums
        # for this asset (AGENTS.md Rule 7 bars trusting those), so verify
        # against a SHA-256 computed here instead. A checksum mismatch means
        # upstream published a new jar; re-verify and update this hash.
        run: |
          curl -sSLo vnu.jar https://github.com/validator/validator/releases/download/latest/vnu.jar
          echo "506657d684d2084bf17a37498fa5fadbbfd705b9b5ba74c8702dd8699f7a09a0  vnu.jar" | sha256sum -c -

      - name: Validate HTML and CSS
        run: java -jar vnu.jar --also-check-css src/*.html src/css/*.css

  upload-coverage-javascript:
    needs: unit-tests
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download JS coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report-javascript
      - name: Upload JS coverage to GitHub
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: coverage-js.xml
          language: JavaScript
          label: code-coverage-agent

  upload-coverage-python:
    needs: unit-tests
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download Python coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report-python
      - name: Upload Python coverage to GitHub
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: coverage-python.xml
          language: Python
          label: code-coverage-agent
