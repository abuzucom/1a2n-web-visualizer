name: Jira integration

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-pr:
    if: contains(github.event.pull_request.labels.*.name, 'needs-jira')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Link pull request to Jira
        env:
          JIRA_BASE_URL: https://abuzucom.atlassian.net
          JIRA_PROJECT_KEY: VID
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ALLOW_CREATE: ${{ contains(github.event.pull_request.labels.*.name, 'jira-create') }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/jira_sync.py pull-request
