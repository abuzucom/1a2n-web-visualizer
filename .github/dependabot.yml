# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot
#
# Two update surfaces in this repo:
#   - JavaScript deps in package.json + package-lock.json (npm)
#   - Actions pinned in .github/workflows/*        (github-actions)
version: 2
updates:
  # JavaScript / TypeScript dependencies (npm).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # Batch low-risk minor/patch bumps into one PR to cut noise.
      # Majors still open individually so they get a proper review.
      js-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used across .github/workflows/*.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
